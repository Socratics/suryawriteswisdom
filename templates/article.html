{% extends "base.html" %}
{% block title %}{{ post.title }} — Small Stories{% endblock %}
{% block content %}
  <article class="article-page">
    <a class="back-link" href="{{ url_for('index') }}">← All stories</a>
    <header class="article-header">
      <p class="eyebrow">A story from the journal</p>
      <h1>{{ post.title }}</h1>
      <p class="article-date">{{ post.published_at[:10] }}</p>
    </header>
    <div class="article-content">{{ post.content|safe }}</div>
  </article>
{% endblock %}
