services:
  - type: web
    name: surya-writes-wisdom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_SECRETS_JSON
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
